{% extends "BestLogMarketPlaceApp/base.html" %}
{% load static %}

{% block content %}


<div class="container">
    <h2>Checkout</h2>
    <p>Total Amount: {{ cart.total_price }}</p>

    <form method="POST" action="{% url 'payment_page' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="customer_email">Email</label>
            <input type="email" name="customer[email]" id="customer_email" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="customer_first_name">First Name</label>
            <input type="text" name="customer[first_name]" id="customer_first_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="customer_last_name">Last Name</label>
            <input type="text" name="customer[last_name]" id="customer_last_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="customer_phone">Phone Number (Optional)</label>
            <input type="text" name="customer[phone]" id="customer_phone" class="form-control">
        </div>
        <button type="submit" class="btn btn--base">Pay with Credo</button>
    </form>
</div>
{% endblock %}
